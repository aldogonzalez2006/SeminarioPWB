spring.application.name=product
spring.datasource.url=jdbc:mysql://localhost:3306/pwb_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driverClassName=com.mysql.jdbc.Driver

#Para crear la tabla automaticamente con hibernate
spring.jpa.hibernate.ddl-auto=update

# Files
app.upload.dir=uploads
app.upload.images=img

# Swagger: Ordenar los endpoints alfabéticamente por etiquetas y luego por ruta
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
